<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The speech engine's worker evals its code and fetches its own wasm from a data: URL; nothing here loads anything remote. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:"
    />
    <title>Conduit wake phrase</title>
  </head>
  <body>
    <script type="module" src="/src/wake/main.ts"></script>
  </body>
</html>
