# Packaging. Windows ships through the Microsoft Store (appx, signed by the
# Store) and as an unsigned installer for testing; the Mac as a dmg, notarized
# once the Apple ID secrets are in the repo's Actions secrets.
appId: dev.conduit.desktop
productName: Conduit
copyright: Copyright © 2026 kaishi00
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack: []
# Link invites (conduit://link/…) opened from another app come to Conduit.
protocols:
  - name: Conduit Link
    schemes: [conduit]
# The tray's icons and the Dock or taskbar icons Settings > Appearance picks, read from the resources folder at run time.
extraResources:
  - from: resources
    to: .
    filter: ['tray*.png', 'icon-*.png']
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
  # The microphone, for dictation and voice messages: macOS asks once, with this.
  extendInfo:
    NSMicrophoneUsageDescription: Conduit uses the microphone for dictation and voice messages.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing and notarizing come with the Developer ID secrets.
  identity: null
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: true
  perMachine: false
appx:
  identityName: Conduit
  displayName: Conduit
  publisherDisplayName: kaishi00
linux:
  target: [AppImage]
  category: Utility
